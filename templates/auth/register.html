{% extends "base.html" %}
{% block title %}Register - Skill Swap Management System{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div class="rounded-circle bg-success-subtle text-success d-inline-flex p-3 mb-2">
            <i class="bi bi-person-plus fs-2"></i>
          </div>
          <h4 class="fw-bold mb-1">Create an Account</h4>
          <p class="text-muted small">Join our community to exchange skills peer-to-peer</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
          <div class="mb-3">
            <label for="name" class="form-label fw-semibold small">Full Name <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="name" name="name" value="{{ name or '' }}" required autofocus placeholder="John Doe">
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label fw-semibold small">Email Address <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required placeholder="name@example.com">
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="password" class="form-label fw-semibold small">Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" required placeholder="Min. 6 chars">
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="confirm_password" class="form-label fw-semibold small">Confirm Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required placeholder="Repeat password">
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label fw-semibold small">Phone Number (Optional)</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-telephone"></i></span>
              <input type="text" class="form-control" id="phone" name="phone" value="{{ phone or '' }}" placeholder="9876543210">
            </div>
          </div>

          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-success py-2 fw-semibold">
              <i class="bi bi-check2-circle me-1"></i> Register Account
            </button>
          </div>
        </form>

        <div class="text-center mt-3 small text-muted">
          Already registered? <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold">Sign in here</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
